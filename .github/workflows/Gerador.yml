# .github/workflows/gerar-mundo.yml
#
# Gera um mundo de Minecraft Bedrock com o Bedrock Dedicated Server (BDS),
# pré-gera chunks com o seu addon e publica o .mcworld numa Release.
#
# ESTRUTURA ESPERADA NO REPO
#   addon/behavior_pack/manifest.json   (obrigatório, o seu addon de pré-geração)
#   addon/resource_pack/manifest.json   (opcional)
#
# CONTRATO COM O ADDON (o workflow fala com ele pelo console do servidor)
#   Início:   scriptevent pregen:start <raio_em_chunks> <centro_x_blocos> <centro_z_blocos>
#   Parada:   scriptevent pregen:stop       (parar e deixar o mundo consistente)
#   O servidor roda SEM jogador: o addon não pode depender de player nem de sendMessage.
#   Confirmação (obrigatória, em até 2 min após o start): console.warn("[PREGEN] START ...")
#   Progresso (opcional, aparece no log): console.warn("[PREGEN] PROGRESS 120/10000")
#   Fim (obrigatório): console.warn("[PREGEN] DONE")
#   Erro fatal (opcional): console.warn("[PREGEN] ABORT motivo") faz o workflow falhar na hora
#
# DISPARO POR ISSUE (label "gerar-mundo", só OWNER/MEMBER/COLLABORATOR)
#   Corpo da issue com um bloco JSON, por exemplo:
#   {
#     "accept_eula": true,
#     "world_name": "MeuMundo",
#     "seed": "12345",
#     "bds_version": "latest",
#     "gamemode": "survival",
#     "difficulty": "normal",
#     "allow_cheats": true,
#     "level_type": "DEFAULT",
#     "radius_chunks": 50,
#     "center_x": 0,
#     "center_z": 0,
#     "max_minutes": 240,
#     "gamerules": { "keepinventory": true, "doinsomnia": false }
#   }
#   Link pré-preenchido (o site estático só precisa montar isto):
#   https://github.com/OWNER/REPO/issues/new?labels=gerar-mundo&title=Gerar+mundo&body=<JSON em URL-encode, dentro de ```json>

name: Gerar mundo Bedrock

on:
  workflow_dispatch:
    inputs:
      accept_eula:
        description: "Aceito os termos da Mojang para baixar o BDS (minecraft.net/eula)"
        type: boolean
        default: false
      world_name:
        description: "Nome do mundo (letras, números, espaço, _ e -)"
        type: string
        default: "Mundo"
      seed:
        description: "Seed (vazio = aleatória)"
        type: string
        default: ""
      bds_version:
        description: "Versão do BDS (ex: 1.21.124.2) ou latest. Tem que ser igual à do seu Minecraft!"
        type: string
        default: "latest"
      gamemode:
        type: choice
        options: [survival, creative, adventure]
        default: survival
      difficulty:
        type: choice
        options: [peaceful, easy, normal, hard]
        default: normal
      allow_cheats:
        type: boolean
        default: true
      radius_chunks:
        description: "Raio da pré-geração em chunks (1 a 100)"
        type: string
        default: "50"
      max_minutes:
        description: "Tempo máximo da pré-geração em minutos (10 a 330)"
        type: string
        default: "240"
      gamerules:
        description: 'Gamerules em JSON, ex: {"keepinventory":true}'
        type: string
        default: "{}"
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  gerar:
    # Issue: só com a label certa e só de quem tem permissão no repo.
    # Para liberar para qualquer pessoa, remova a checagem de author_association
    # (e esteja ciente de que isso gasta os seus minutos de Actions).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       contains(github.event.issue.labels.*.name, 'gerar-mundo') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ler e validar a configuração
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          def die(msg):
              print(f"::error::{msg}")
              sys.exit(1)

          def to_bool(v):
              if isinstance(v, bool):
                  return v
              return str(v).strip().lower() in ("true", "1", "sim", "yes")

          if os.environ["EVENT_NAME"] == "issues":
              body = os.environ.get("ISSUE_BODY") or ""
              m = re.search(r"```(?:json)?\s*(\{.*?\})\s*```", body, re.S)
              try:
                  raw = json.loads(m.group(1) if m else body)
              except Exception as e:
                  die(f"JSON inválido no corpo da issue: {e}")
          else:
              raw = json.loads(os.environ.get("INPUTS_JSON") or "null") or {}
              g = raw.get("gamerules")
              if isinstance(g, str):
                  try:
                      raw["gamerules"] = json.loads(g or "{}")
                  except Exception as e:
                      die(f"gamerules não é um JSON válido: {e}")

          if not isinstance(raw, dict):
              die("A configuração precisa ser um objeto JSON.")

          def get(key, default):
              v = raw.get(key)
              return default if v in (None, "") else v

          def get_int(key, default, lo, hi):
              try:
                  v = int(str(get(key, default)))
              except ValueError:
                  die(f"{key} precisa ser um número inteiro.")
              if not lo <= v <= hi:
                  die(f"{key} fora do intervalo permitido ({lo} a {hi}).")
              return v

          def get_choice(key, default, options):
              v = str(get(key, default)).strip().lower()
              if v not in options:
                  die(f"{key} inválido. Use um destes: {', '.join(options)}")
              return v

          cfg = {}
          cfg["accept_eula"] = to_bool(get("accept_eula", False))
          if not cfg["accept_eula"]:
              die("Defina accept_eula como true para confirmar que aceita os termos da Mojang (minecraft.net/eula).")

          name = str(get("world_name", "Mundo")).strip()
          if not re.fullmatch(r"[A-Za-z0-9 _-]{1,32}", name):
              die("world_name aceita só letras, números, espaço, _ e - (até 32 caracteres).")
          cfg["world_name"] = name
          cfg["slug"] = re.sub(r"[^a-z0-9]+", "-", name.lower()).strip("-") or "mundo"

          seed = str(get("seed", ""))
          if not re.fullmatch(r"[A-Za-z0-9_ .-]{0,40}", seed):
              die("seed aceita só letras, números, espaço, _ . e - (até 40 caracteres).")
          cfg["seed"] = seed

          ver = str(get("bds_version", "latest")).strip()
          if not re.fullmatch(r"latest|\d+\.\d+\.\d+\.\d+", ver):
              die("bds_version precisa ser 'latest' ou algo como 1.21.124.2")
          cfg["bds_version"] = ver

          cfg["gamemode"] = get_choice("gamemode", "survival", ["survival", "creative", "adventure"])
          cfg["difficulty"] = get_choice("difficulty", "normal", ["peaceful", "easy", "normal", "hard"])
          cfg["level_type"] = get_choice("level_type", "DEFAULT", ["default", "flat", "legacy"]).upper()
          cfg["allow_cheats"] = to_bool(get("allow_cheats", True))
          cfg["radius_chunks"] = get_int("radius_chunks", 50, 1, 100)
          cfg["center_x"] = get_int("center_x", 0, -30000000, 30000000)
          cfg["center_z"] = get_int("center_z", 0, -30000000, 30000000)
          cfg["max_minutes"] = get_int("max_minutes", 240, 10, 330)

          rules = get("gamerules", {})
          if not isinstance(rules, dict) or len(rules) > 30:
              die("gamerules precisa ser um objeto JSON com até 30 regras.")
          clean = {}
          for k, v in rules.items():
              k = str(k).strip().lower()
              if not re.fullmatch(r"[a-z]{3,40}", k):
                  die(f"Nome de gamerule inválido: {k}")
              if isinstance(v, bool):
                  clean[k] = "true" if v else "false"
              elif isinstance(v, int):
                  clean[k] = str(v)
              else:
                  die(f"Valor inválido para a gamerule {k} (use true/false ou número).")
          cfg["gamerules"] = clean

          path = os.path.join(os.environ["RUNNER_TEMP"], "config.json")
          with open(path, "w") as f:
              json.dump(cfg, f, indent=2)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CONFIG={path}\n")

          shown = {k: v for k, v in cfg.items() if k != "accept_eula"}
          print(json.dumps(shown, indent=2, ensure_ascii=False))
          PY

      - name: Baixar o Bedrock Dedicated Server
        run: |
          set -euo pipefail
          # O site da Mojang bloqueia user-agents de script, então usamos um de navegador.
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          VERSION=$(jq -r .bds_version "$CONFIG")

          if [ "$VERSION" = "latest" ]; then
            # API oficial de links de download (a página HTML do site não serve mais para isso)
            API="https://net-secondary.web.minecraft-services.net/api/v1.0/download/links"
            JSON=$(curl -fsSL --retry 3 -A "$UA" "$API" || true)
            URL=$(jq -r '.result.links[]? | select(.downloadType == "serverBedrockLinux") | .downloadUrl' <<<"$JSON" 2>/dev/null | head -n 1 || true)
            if [ -z "$URL" ]; then
              echo "::error::Não consegui obter a versão mais recente pela API da Mojang. Informe bds_version explicitamente."
              echo "Resposta da API (início): ${JSON:0:300}"
              exit 1
            fi
            VERSION=$(sed -E 's/.*bedrock-server-(.*)\.zip/\1/' <<<"$URL")
          else
            URL="https://www.minecraft.net/bedrockdedicatedserver/bin-linux/bedrock-server-${VERSION}.zip"
          fi

          # Valida antes de usar (o valor vem de fora do repositório)
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || ! [[ "$URL" =~ ^https://www\.minecraft\.net/bedrockdedicatedserver/bin-linux/bedrock-server-[0-9.]+\.zip$ ]]; then
            echo "::error::Versão ou URL inesperada: $VERSION / $URL"
            exit 1
          fi

          echo "BDS_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Baixando BDS $VERSION"
          echo "URL: $URL"
          HTTP=$(curl -sL --retry 3 -A "$UA" -o bds.zip -w '%{http_code}' "$URL" || true)
          if [ "$HTTP" != "200" ]; then
            echo "::error::Falha ao baixar o BDS (HTTP $HTTP). Confira se a versão $VERSION existe ou se o site está bloqueando o runner (403)."
            exit 1
          fi
          mkdir bds
          unzip -q bds.zip -d bds
          chmod +x bds/bedrock_server

      - name: Configurar servidor, mundo e addon
        run: |
          set -euo pipefail
          test -f addon/behavior_pack/manifest.json || {
            echo "::error::Não achei addon/behavior_pack/manifest.json no repositório."
            exit 1
          }
          python3 - <<'PY'
          import json, os, re, shutil, sys

          cfg = json.load(open(os.environ["CONFIG"]))
          name = cfg["world_name"]

          # --- server.properties ---
          props = {
              "server-name": "Pregen",
              "level-name": name,
              "level-seed": cfg["seed"],
              "level-type": cfg["level_type"],
              "gamemode": cfg["gamemode"],
              "difficulty": cfg["difficulty"],
              "allow-cheats": "true" if cfg["allow_cheats"] else "false",
              "online-mode": "false",
              "content-log-file-enabled": "true",
          }
          path = "bds/server.properties"
          shutil.copyfile(path, path + ".orig")   # guardado para a release mostrar o que mudou
          out, seen = [], set()
          for line in open(path).read().splitlines():
              m = re.match(r"^([A-Za-z0-9_.-]+)=", line)
              if m and m.group(1) in props:
                  out.append(f"{m.group(1)}={props[m.group(1)]}")
                  seen.add(m.group(1))
              else:
                  out.append(line)
          out += [f"{k}={v}" for k, v in props.items() if k not in seen]
          open(path, "w").write("\n".join(out) + "\n")

          # --- packs dentro da pasta do mundo (vão junto no .mcworld) ---
          world = f"bds/worlds/{name}"

          def install(src, dest_name, listing):
              if not os.path.isfile(f"{src}/manifest.json"):
                  return
              try:
                  header = json.load(open(f"{src}/manifest.json"))["header"]
              except Exception as e:
                  print(f"::error::manifest.json de {src} ilegível (comentários no JSON?): {e}")
                  sys.exit(1)
              version = header["version"]
              if not isinstance(version, list):
                  print(f"::error::Use version como lista [x, y, z] no manifest de {src}.")
                  sys.exit(1)
              kind_dir = "behavior_packs" if "behavior" in listing else "resource_packs"
              dest = f"{world}/{kind_dir}/{dest_name}"
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copytree(src, dest)
              with open(f"{world}/{listing}", "w") as f:
                  json.dump([{"pack_id": header["uuid"], "version": version}], f)
              packs.append({
                  "tipo": "Behavior pack" if kind_dir == "behavior_packs" else "Resource pack",
                  "nome": header.get("name", dest_name),
                  "versao": version,
                  "uuid": header["uuid"],
                  "pasta": f"{kind_dir}/{dest_name}",
              })
              print(f"Pack instalado: {src} -> {dest}")

          packs = []
          os.makedirs(world, exist_ok=True)
          install("addon/behavior_pack", "pregen_bp", "world_behavior_packs.json")
          install("addon/resource_pack", "pregen_rp", "world_resource_packs.json")
          with open(os.path.join(os.environ["RUNNER_TEMP"], "packs.json"), "w") as f:
              json.dump(packs, f, ensure_ascii=False)
          PY

      - name: Gerar o mundo (pré-geração)
        id: gerar
        run: |
          set -uo pipefail
          cd bds
          START=$(date +%s)

          NAME=$(jq -r .world_name "$CONFIG")
          RADIUS=$(jq -r .radius_chunks "$CONFIG")
          CX=$(jq -r .center_x "$CONFIG")
          CZ=$(jq -r .center_z "$CONFIG")
          MAX_MIN=$(jq -r .max_minutes "$CONFIG")

          # Console do servidor via FIFO. O "sleep infinity" mantém a ponta
          # de escrita aberta para o servidor nunca receber EOF.
          mkfifo console.in
          sleep infinity > console.in &
          KEEP_PID=$!
          LD_LIBRARY_PATH=. ./bedrock_server < console.in > server.log 2>&1 &
          SERVER_PID=$!
          say() { echo "$1" > console.in; }

          # 1) Espera o servidor subir (até ~4 min)
          STARTED=0
          for _ in $(seq 1 120); do
            if grep -q "Server started" server.log; then STARTED=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::O servidor encerrou durante a inicialização."
              tail -n 60 server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$STARTED" -ne 1 ]; then
            echo "::error::Timeout esperando o servidor iniciar."
            tail -n 60 server.log
            exit 1
          fi
          echo "Servidor no ar."

          # 2) Gamerules (ficam salvas no level.dat)
          while read -r key value; do
            [ -n "$key" ] && { say "gamerule $key $value"; sleep 0.5; }
          done < <(jq -r '.gamerules | to_entries[] | "\(.key) \(.value)"' "$CONFIG")

          # 3) Dispara a pré-geração no addon
          say "scriptevent pregen:start $RADIUS $CX $CZ"
          echo "Pré-geração iniciada: raio=$RADIUS chunks, centro=($CX, $CZ), limite=${MAX_MIN} min"

          # 3b) O addon precisa confirmar que recebeu o comando (senão não há por que esperar horas)
          ACK=0
          for _ in $(seq 1 24); do
            if grep -q "\[PREGEN\]" server.log; then ACK=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::O servidor encerrou logo após o comando de início."
              tail -n 60 server.log
              exit 1
            fi
            sleep 5
          done
          if [ "$ACK" -ne 1 ]; then
            echo "::error::O addon não respondeu em 2 minutos (nenhuma linha [PREGEN] no log). Confira se ele atende 'scriptevent pregen:start' sem jogador e se escreve com console.warn."
            tail -n 80 server.log
            exit 1
          fi

          # 4) Espera o addon avisar que terminou
          DEADLINE=$(( $(date +%s) + MAX_MIN * 60 ))
          DONE=0
          LAST=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if grep -q "\[PREGEN\] DONE" server.log; then DONE=1; break; fi
            if grep -q "\[PREGEN\] ABORT" server.log; then
              echo "::error::O addon abortou a pré-geração:"
              grep "\[PREGEN\] ABORT" server.log | tail -n 3
              tail -n 40 server.log
              exit 1
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "::error::O servidor encerrou antes de a pré-geração terminar."
              tail -n 60 server.log
              exit 1
            fi
            CUR=$(grep "\[PREGEN\] PROGRESS" server.log | tail -n 1 || true)
            if [ -n "$CUR" ] && [ "$CUR" != "$LAST" ]; then echo "$CUR"; LAST="$CUR"; fi
            sleep 15
          done

          if [ "$DONE" -ne 1 ]; then
            echo "::warning::Tempo máximo atingido. Pedindo para o addon parar e empacotando o que já foi gerado."
            say "scriptevent pregen:stop"
            sleep 20
          fi
          echo "done=$DONE" >> "$GITHUB_OUTPUT"
          LAST=$(grep "\[PREGEN\] PROGRESS" server.log | tail -n 1 | sed -E 's/.*\[PREGEN\] //' || true)
          jq -n --argjson done "$DONE" --argjson elapsed "$(( $(date +%s) - START ))" --arg last "${LAST:-}" \
            '{done: ($done == 1), elapsed_s: $elapsed, last_progress: $last}' > "$RUNNER_TEMP/run-info.json"

          # 5) Desliga com 'stop' para o mundo ser salvo por completo
          say "stop"
          for _ in $(seq 1 60); do
            kill -0 "$SERVER_PID" 2>/dev/null || break
            sleep 2
          done
          kill -TERM "$SERVER_PID" 2>/dev/null || true
          kill "$KEEP_PID" 2>/dev/null || true

          test -f "worlds/$NAME/level.dat" || {
            echo "::error::level.dat não encontrado. O mundo não foi salvo."
            exit 1
          }
          echo "Mundo salvo."

      - name: Empacotar .mcworld
        run: |
          set -euo pipefail
          NAME=$(jq -r .world_name "$CONFIG")
          SLUG=$(jq -r .slug "$CONFIG")
          OUT="$GITHUB_WORKSPACE/${SLUG}.mcworld"
          # O conteúdo da pasta do mundo fica na raiz do zip (formato esperado pelo jogo)
          (cd "bds/worlds/$NAME" && zip -qr "$OUT" .)
          SIZE=$(stat -c %s "$OUT")
          echo "MCWORLD=$OUT" >> "$GITHUB_ENV"
          echo "MCWORLD_MB=$(( SIZE / 1024 / 1024 ))" >> "$GITHUB_ENV"
          echo "MCWORLD_SHA=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          if [ "$SIZE" -ge 2000000000 ]; then
            echo "::error::O arquivo passou de 2 GB, que é o limite de assets de Release. Reduza o raio."
            exit 1
          fi
          ls -lh "$OUT"

      - name: Montar as notas da release (o que foi editado no mundo)
        run: |
          python3 - <<'PY'
          import json, os

          tmp = os.environ["RUNNER_TEMP"]
          cfg = json.load(open(os.environ["CONFIG"]))
          info = json.load(open(f"{tmp}/run-info.json"))
          packs = json.load(open(f"{tmp}/packs.json"))

          def read_props(path):
              d = {}
              for line in open(path, encoding="utf-8", errors="replace").read().splitlines():
                  if line and not line.startswith("#") and "=" in line:
                      k, v = line.split("=", 1)
                      d[k.strip()] = v.strip()
              return d

          def show(v):
              return "(vazio)" if v == "" else f"`{v}`"

          old = read_props("bds/server.properties.orig")
          new = read_props("bds/server.properties")
          changed = [(k, old.get(k, "(não existia)"), v) for k, v in new.items() if old.get(k) != v]
          log = open("bds/server.log", encoding="utf-8", errors="replace").read().lower()

          r = cfg["radius_chunks"]
          ccx, ccz = cfg["center_x"] // 16, cfg["center_z"] // 16
          side_chunks = 2 * r + 1
          x0, x1 = (ccx - r) * 16, (ccx + r) * 16 + 15
          z0, z1 = (ccz - r) * 16, (ccz + r) * 16 + 15
          mins, secs = divmod(int(info["elapsed_s"]), 60)

          L = []
          L.append(f'# Mundo "{cfg["world_name"]}"')
          L.append("")
          if info["done"]:
              L.append("**Pré-geração concluída.**")
          else:
              L.append("**Pré-geração INCOMPLETA:** o tempo máximo acabou. O que já foi gerado está no mundo, "
                       "e o addon continua de onde parou quando você abrir o mundo no jogo.")
          L.append("")
          L.append("## O que foi editado no mundo")
          L.append("")
          L.append("### Configurações do mundo (server.properties)")
          L.append("")
          L.append("| Propriedade | Antes | Depois |")
          L.append("|---|---|---|")
          for k, a, b in changed:
              L.append(f"| `{k}` | {show(a) if a != '(não existia)' else a} | {show(b)} |")
          L.append("")
          L.append("### Gamerules")
          L.append("")
          if cfg["gamerules"]:
              for k, v in cfg["gamerules"].items():
                  ok = f"game rule {k} has been updated to {v}" in log
                  L.append(f"- `{k}` = `{v}` ({'confirmada no log do servidor' if ok else 'sem confirmação no log do servidor'})")
          else:
              L.append("- Nenhuma gamerule alterada.")
          L.append("")
          L.append("### Packs adicionados ao mundo")
          L.append("")
          for p in packs:
              ver = ".".join(str(n) for n in p["versao"])
              L.append(f"- {p['tipo']} **{p['nome']}** v{ver} (`{p['uuid']}`), em `{p['pasta']}`")
          L.append("")
          L.append("### Pré-geração de chunks")
          L.append("")
          L.append(f"- Raio: **{r} chunks** (quadrado de {side_chunks}x{side_chunks} = {side_chunks * side_chunks:,} chunks)".replace(",", "."))
          L.append(f"- Centro: bloco ({cfg['center_x']}, {cfg['center_z']}), chunk ({ccx}, {ccz})")
          L.append(f"- Área coberta: X de {x0} a {x1} e Z de {z0} a {z1}")
          L.append(f"- Tempo: {mins} min {secs} s")
          if info.get("last_progress"):
              L.append(f"- Último progresso reportado pelo addon: `{info['last_progress']}`")
          L.append("")
          L.append("## Servidor e arquivo")
          L.append("")
          L.append(f"- Versão do BDS: **{os.environ['BDS_VERSION']}** (use a mesma versão do Minecraft para abrir o mundo)")
          L.append(f"- Tamanho: {os.environ['MCWORLD_MB']} MB")
          L.append(f"- SHA-256: `{os.environ['MCWORLD_SHA']}`")
          L.append("")
          L.append("## Como importar")
          L.append("")
          L.append("Baixe o arquivo `.mcworld` e abra-o no Minecraft Bedrock. O mundo será importado automaticamente.")

          open(f"{tmp}/release-notes.md", "w", encoding="utf-8").write("\n".join(L) + "\n")
          print("\n".join(L))
          PY

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          SLUG=$(jq -r .slug "$CONFIG")
          TAG="mundo-${SLUG}-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" "$MCWORLD" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mundo ${SLUG} (BDS ${BDS_VERSION})" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "Release: $URL"
          { cat "$RUNNER_TEMP/release-notes.md"; echo; echo "[Abrir a release]($URL)"; } >> "$GITHUB_STEP_SUMMARY"

          if [ "$EVENT_NAME" = "issues" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --body "Mundo gerado: $URL (as notas da release listam tudo o que foi editado no mundo)."
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" || true
          fi

      - name: Logs do servidor (em caso de falha)
        if: failure()
        run: |
          echo "---- server.log (últimas 150 linhas) ----"
          tail -n 150 bds/server.log || true
          echo "---- logs de conteúdo/scripts ----"
          tail -n 100 bds/logs/* 2>/dev/null || true
